<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GA4 Testing Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #4285f4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GA4 Testing Lab</h1>

        <p>
            This website is for testing Google Analytics 4 events.
        </p>

        <div class="card">

            <h2>Test Events</h2>

            <button>View Product</button>
            <button>Add to Cart</button>
            <button>Sign Up</button>
            <button>Login</button>
            <button>Purchase</button>

        </div>

    </div>

</body>
</html>
